[project]
name = "skill-learning-mpe"
version = "0.1.0"
description = "Minimal JAX MAPPO baseline for selected team-skill-learning MPE environments"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "jax[cuda13]>=0.6.0",
  "flax>=0.10.1",
  "optax>=0.2.4",
  "distrax>=0.1.5",
  "chex>=0.1.87",
  "numpy>=1.26",
  "pyyaml>=6.0",
  "tqdm>=4.67",
  "safetensors>=0.4.5",
]

[project.optional-dependencies]
wandb = ["wandb>=0.18.7"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skill_learning_mpe"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
